<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="live-dot"></span>
      <span class="brand-title" id="brand-title">SYSTEM MONITOR</span>
      <span class="brand-sub">// LIVE STATUS</span>
    </div>
    <div class="topbar-right">
      <span id="clock" class="clock"></span>
      <span id="conn-state" class="conn-state">CONNECTING…</span>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <div id="hero" class="hero hidden"></div>

  <main id="machines" class="machines">
    <div class="waiting" id="waiting">Waiting for first agent report…</div>
  </main>

  <section class="events-panel">
    <div class="panel-title">LIVE CALL FEED <span id="calls-rate" class="panel-note"></span></div>
    <div id="calls" class="events"></div>
  </section>

  <footer class="footer" id="brand-footer">INFRASTRUCTURE MONITOR</footer>

  <div id="trend-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="trend-title" class="modal-title"></span>
        <span class="trend-range">
          <button data-h="6">6H</button><button data-h="24" class="active">24H</button><button data-h="168">7D</button><button data-h="720">30D</button>
        </span>
        <button id="trend-close" class="modal-close" title="Close (Esc)">&times;</button>
      </div>
      <canvas id="trend-canvas"></canvas>
      <div id="trend-stats" class="modal-stats"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

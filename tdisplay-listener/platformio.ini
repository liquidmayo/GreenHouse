; HGA Listener Counter — LilyGo T-Display S3 (ESP32-S3, ST7789 320x170)
;
; Pinned to espressif32@6.5.0 (Arduino core 2.0.17): TFT_eSPI has known
; breakage on Arduino core 3.x (Bodmer/TFT_eSPI#3329).
; Display pins come from TFT_eSPI's official Setup206_LilyGo_T_Display_S3.h,
; injected via build flags — USER_SETUP_LOADED=1 is REQUIRED for them to win.

[env:tdisplay-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- TFT_eSPI: LilyGo T-Display S3 (Setup206) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DINIT_SEQUENCE_3
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON
    -DTFT_PARALLEL_8_BIT
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT

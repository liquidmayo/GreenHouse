; HGA Listener Counter — LilyGo T-Display S3 AMOLED (1.91" non-touch)
; RM67162 QSPI 536x240 panel, driven by the vendored driver in src/rm67162.*
; (from LilyGo's factory example). TFT_eSPI is used ONLY as a sprite/font
; engine — it never touches the hardware; frames are pushed via
; lcd_PushColors(). No board id exists upstream, so boards/ is vendored.
;
; NOTE: ARDUINO_USB_CDC_ON_BOOT is deliberately NOT set — a 24/7 wall-powered
; display must never wait on a USB host at boot. Serial prints go to UART0
; (invisible over USB); flashing still works over native USB as usual.

[platformio]
boards_dir = boards

[env:tdisplay-amoled]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
